[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svkv-compression"
version = "0.1.0"
description = "Decision pilot for blockwise support-vector KV cache selection"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "scikit-learn", "mlx-lm; sys_platform == 'darwin'", "psutil"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
